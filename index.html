<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>山上山下 · 深濃咖喱飯</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --brand: #B22222;
    --brand-dark: #8B1A1A;
    --paper: #f1e7d3;
    --paper-2: #e6d8be;
    --paper-3: #d8c5a3;
    --ink: #2b1f15;
    --ink-2: #5a4632;
    --ink-3: #8b7656;
    --bg: #f7efe0;
    --card: #fffaf0;
    --line: rgba(43, 31, 21, 0.12);
    --shadow-sm: 0 1px 2px rgba(43, 31, 21, .06), 0 2px 6px rgba(43, 31, 21, .04);
    --shadow-md: 0 4px 12px rgba(43, 31, 21, .08), 0 10px 30px rgba(43, 31, 21, .06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans TC', 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at top, #2a1a10 0%, #140b06 60%, #0a0503 100%);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body[data-lang="ja"] { font-family: 'Noto Sans JP', 'Noto Sans TC', system-ui, sans-serif; }
  body[data-lang="ko"] { font-family: 'Noto Sans KR', 'Noto Sans TC', system-ui, sans-serif; }
  body[data-lang="en"] { font-family: 'Noto Sans', 'Noto Sans TC', system-ui, sans-serif; }

  /* phone column ─ 375px design */
  .phone {
    width: 375px;
    margin: 0 auto;
    background:
      repeating-linear-gradient(0deg, rgba(120, 80, 30, .015) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120, 80, 30, .015) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, var(--paper) 0%, #ece0c6 100%);
    box-shadow: 0 0 60px rgba(0, 0, 0, .5);
    position: relative;
    overflow-x: hidden;
  }
  @media (max-width: 420px) {
    .phone { width: 100%; box-shadow: none; }
  }

  /* ───── language pill ───── */
  .lang-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 10px 16px 10px;
    background: linear-gradient(180deg, rgba(241, 231, 211, .98) 0%, rgba(241, 231, 211, .92) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .lang-pills {
    display: flex;
    gap: 6px;
    background: rgba(43, 31, 21, .06);
    padding: 4px;
    border-radius: 999px;
  }
  .lang-pill {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--ink-2);
    padding: 7px 4px;
    border-radius: 999px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    transition: background .18s, color .18s, transform .18s;
  }
  .lang-pill.active {
    background: var(--brand);
    color: #fff5e8;
    box-shadow: 0 2px 6px rgba(178, 34, 34, .35);
  }

  /* ───── hero ───── */
  .hero {
    padding: 28px 24px 22px;
    text-align: center;
    background:
      radial-gradient(ellipse 200% 80% at 50% 100%, rgba(178, 34, 34, .08) 0%, transparent 70%);
    border-bottom: 1px solid var(--line);
  }
  .crest {
    width: 92px;
    height: 92px;
    margin: 0 auto 14px;
    position: relative;
  }
  .crest-circle {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(43, 31, 21, .25);
    overflow: hidden;
    position: relative;
  }
  .crest-circle::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    border: 1.5px solid rgba(241, 231, 211, .7);
  }
  .crest-circle svg { width: 56%; height: 56%; }
  .brand-name {
    font-family: 'Noto Serif TC', 'Noto Sans TC', serif;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: .12em;
    color: var(--ink);
    margin: 0;
    line-height: 1.1;
  }
  body[data-lang="en"] .brand-name { font-family: 'Noto Sans', serif; letter-spacing: .08em; font-size: 26px; }
  body[data-lang="ja"] .brand-name { font-family: 'Noto Sans JP', serif; }
  body[data-lang="ko"] .brand-name { font-family: 'Noto Sans KR', serif; }
  .brand-sub {
    font-size: 12px;
    font-weight: 500;
    color: var(--brand);
    letter-spacing: .3em;
    margin: 8px 0 0;
    text-transform: uppercase;
  }
  body[data-lang="ja"] .brand-sub,
  body[data-lang="ko"] .brand-sub { letter-spacing: .2em; text-transform: none; }
  .brand-tagline {
    margin: 14px auto 0;
    max-width: 280px;
    font-size: 11.5px;
    color: var(--ink-2);
    line-height: 1.6;
    letter-spacing: .04em;
  }

  /* ───── info card ───── */
  .info {
    margin: 18px 16px 0;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    display: grid;
    gap: 10px;
  }
  .info-row { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; line-height: 1.55; }
  .info-icon {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 8px;
    background: rgba(178, 34, 34, .08);
    color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .info-label { color: var(--ink-3); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2px; }
  .info-value { color: var(--ink); font-weight: 500; }
  .info-value a { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--ink-3); }
  .info-value.phone a { white-space: nowrap; }

  /* ───── category tabs (sticky scroll-spy) ───── */
  .cat-bar {
    position: sticky;
    top: 50px;
    z-index: 40;
    margin-top: 20px;
    background: linear-gradient(180deg, rgba(241, 231, 211, .97), rgba(241, 231, 211, .9));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .cat-bar-inner {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 10px 16px;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .cat-bar-inner::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex-shrink: 0;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-2);
    padding: 7px 14px;
    border-radius: 999px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .18s, color .18s, border-color .18s;
  }
  .cat-chip.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* ───── sections ───── */
  .sections { padding: 8px 16px 90px; }
  .section { padding-top: 28px; scroll-margin-top: 110px; }
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1.5px solid var(--ink);
  }
  .section-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--ink);
    margin: 0;
    letter-spacing: .04em;
  }
  body[data-lang="en"] .section-title { font-family: 'Noto Sans', serif; }
  body[data-lang="ja"] .section-title { font-family: 'Noto Sans JP', serif; }
  body[data-lang="ko"] .section-title { font-family: 'Noto Sans KR', serif; }
  .section-count {
    font-size: 10.5px;
    color: var(--ink-3);
    letter-spacing: .12em;
    font-variant-numeric: tabular-nums;
  }

  /* ───── item cards ───── */
  .items { display: grid; gap: 10px; }
  .card {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 12px;
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform .18s, box-shadow .18s, border-color .18s;
    text-align: left;
    font: inherit;
    color: inherit;
    width: 100%;
  }
  .card:active { transform: scale(.985); box-shadow: var(--shadow-sm); }

  .card-img {
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--paper-2), var(--paper-3));
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .card-img::before {
    content: '';
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 1px, transparent 1px 6px);
    pointer-events: none;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }

  .card-body { min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0; }
  .card-name {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink);
    margin: 0 0 4px;
    word-break: break-word;
  }
  body[data-lang="en"] .card-name { font-size: 14.5px; }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin: 2px 0 6px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(43, 31, 21, .07);
    color: var(--ink-2);
    letter-spacing: .02em;
  }
  .tag.tag-R { background: rgba(178, 34, 34, .12); color: var(--brand-dark); }
  .tag.tag-1, .tag.tag-2, .tag.tag-3 { background: rgba(220, 80, 30, .12); color: #b3431a; }
  .tag-icon { font-size: 11px; }

  .card-prices {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: auto;
  }
  .price-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12.5px;
  }
  .price-label { color: var(--ink-2); }
  .price-value { font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .price-value.single { font-size: 16px; }
  .card-note {
    font-size: 11px;
    color: var(--ink-3);
    line-height: 1.45;
    margin-top: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* compact card (for sides, snacks, toppings) */
  .card.compact { grid-template-columns: 56px 1fr; gap: 10px; padding: 10px; }
  .card.compact .card-img { font-size: 26px; }
  .card.compact .card-name { font-size: 14px; margin-bottom: 2px; }

  /* ───── dining info footer ───── */
  .dining-card {
    margin: 32px 16px 24px;
    padding: 16px 18px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 14px;
    box-shadow: var(--shadow-md);
  }
  .dining-title {
    font-size: 12px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--paper-3);
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dining-title::after {
    content: ''; flex: 1; height: 1px;
    background: rgba(241, 231, 211, .2);
  }
  body[data-lang="ja"] .dining-title,
  body[data-lang="ko"] .dining-title { letter-spacing: .15em; text-transform: none; }
  .dining-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .dining-list li {
    font-size: 12px;
    line-height: 1.55;
    color: var(--paper);
    padding-left: 14px;
    position: relative;
    opacity: .92;
  }
  .dining-list li::before {
    content: '';
    position: absolute;
    left: 0; top: 8px;
    width: 4px; height: 4px;
    background: var(--brand);
    border-radius: 50%;
  }

  .footer-mark {
    text-align: center;
    padding: 16px 24px 32px;
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: .25em;
  }

  /* ───── modal ───── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 11, 6, .65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%;
    max-width: 375px;
    max-height: 92vh;
    background: var(--card);
    border-radius: 22px 22px 0 0;
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.22, .61, .36, 1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-backdrop.open .modal { transform: translateY(0); }
  .modal-grabber {
    width: 38px; height: 4px;
    border-radius: 2px;
    background: rgba(43, 31, 21, .2);
    margin: 8px auto 0;
    flex-shrink: 0;
  }
  .modal-scroll {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 0 24px;
  }
  .modal-img {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, var(--paper-2), var(--paper-3));
    display: flex; align-items: center; justify-content: center;
    font-size: 100px;
    overflow: hidden;
    position: relative;
    touch-action: pinch-zoom;
  }
  .modal-img::before {
    content: '';
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 1px, transparent 1px 8px);
    pointer-events: none;
  }
  .modal-img img { width: 100%; height: 100%; object-fit: contain; }
  .modal-body { padding: 18px 20px 0; }
  .modal-name {
    font-size: 22px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.25;
    margin: 0 0 10px;
    font-family: 'Noto Serif TC', serif;
  }
  body[data-lang="en"] .modal-name { font-family: 'Noto Sans', serif; }
  body[data-lang="ja"] .modal-name { font-family: 'Noto Sans JP', serif; }
  body[data-lang="ko"] .modal-name { font-family: 'Noto Sans KR', serif; }

  .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .modal-tags .tag { font-size: 11px; padding: 4px 9px; }

  .modal-price-block {
    margin: 12px 0 18px;
    padding: 12px 14px;
    background: rgba(178, 34, 34, .06);
    border-radius: 10px;
    border: 1px solid rgba(178, 34, 34, .15);
  }
  .modal-price-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 4px 0;
    font-size: 14px;
  }
  .modal-price-row + .modal-price-row { border-top: 1px dashed rgba(178, 34, 34, .2); }
  .modal-price-row .price-value { font-size: 17px; }
  .modal-price-row .price-value.single { font-size: 22px; }

  .modal-field { margin-bottom: 14px; }
  .modal-field-label {
    font-size: 10.5px;
    color: var(--ink-3);
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  body[data-lang="ja"] .modal-field-label,
  body[data-lang="ko"] .modal-field-label { letter-spacing: .1em; text-transform: none; }
  .modal-field-value {
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--ink);
  }
  .modal-field-value.note {
    background: var(--paper);
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--ink-2);
    font-size: 12.5px;
  }

  .modal-close {
    position: sticky;
    top: 0;
    align-self: flex-end;
    margin: -34px 14px 0 auto;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 0;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    z-index: 2;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .section { animation: fadeUp .4s ease both; }
</style>
</head>
<body data-lang="zh">
<div class="phone" id="phone">

  <!-- Language switcher (sticky) -->
  <nav class="lang-bar">
    <div class="lang-pills" id="lang-pills"></div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <div class="crest">
      <div class="crest-circle">
        <svg viewBox="0 0 100 60" aria-hidden="true">
          <polygon points="10,55 35,15 50,35 65,5 90,55" fill="#f1e7d3" />
          <circle cx="72" cy="14" r="5" fill="#B22222" />
        </svg>
      </div>
    </div>
    <h1 class="brand-name" id="brand-name">山上山下</h1>
    <p class="brand-sub" id="brand-sub">深濃咖喱飯</p>
    <p class="brand-tagline" id="brand-tagline"></p>
  </header>

  <!-- Store info -->
  <section class="info" aria-label="store info">
    <div class="info-row">
      <div class="info-icon" aria-hidden="true">📍</div>
      <div>
        <div class="info-label" id="addr-label">Address</div>
        <div class="info-value" id="addr-value"></div>
      </div>
    </div>
    <div class="info-row">
      <div class="info-icon" aria-hidden="true">📞</div>
      <div>
        <div class="info-label" id="phone-label">Phone</div>
        <div class="info-value phone"><a href="tel:0974032894">0974-032-894</a></div>
      </div>
    </div>
  </section>

  <!-- Category tabs (sticky) -->
  <nav class="cat-bar">
    <div class="cat-bar-inner" id="cat-bar"></div>
  </nav>

  <!-- Sections -->
  <main class="sections" id="sections"></main>

  <!-- Dining info card -->
  <section class="dining-card" id="dining-card" aria-label="dining info">
    <h3 class="dining-title" id="dining-title">DINE-IN</h3>
    <ul class="dining-list" id="dining-list"></ul>
  </section>

  <div class="footer-mark">山上山下 · 3S3S.TW</div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-grabber" aria-hidden="true"></div>
      <div class="modal-scroll" id="modal-scroll">
        <div class="modal-img" id="modal-img"></div>
        <button class="modal-close" id="modal-close" aria-label="close">✕</button>
        <div class="modal-body">
          <h2 class="modal-name" id="modal-name"></h2>
          <div class="modal-tags" id="modal-tags"></div>
          <div class="modal-price-block" id="modal-prices"></div>
          <div class="modal-field" id="modal-desc-wrap" hidden>
            <div class="modal-field-label" id="modal-desc-label"></div>
            <div class="modal-field-value" id="modal-desc"></div>
          </div>
          <div class="modal-field" id="modal-note-wrap" hidden>
            <div class="modal-field-label" id="modal-note-label"></div>
            <div class="modal-field-value note" id="modal-note"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script type="module">
  import { menuItems, categories, tagDefs, store, ui } from './menu-items.js';

  // ─────── state ───────
  let lang = 'zh';
  let scrollSpyActive = true;

  // ─────── helpers ───────
  const $ = (id) => document.getElementById(id);
  const fmtPrice = (v) => {
    if (v === 'market') return ui.market[lang];
    if (typeof v === 'string' && v.startsWith('+')) return 'NT$' + v;
    return 'NT$' + v;
  };

  // ─────── render: language pills ───────
  function renderLangPills() {
    const wrap = $('lang-pills');
    wrap.innerHTML = '';
    ui.langs.forEach(({ code, label }) => {
      const btn = document.createElement('button');
      btn.className = 'lang-pill' + (code === lang ? ' active' : '');
      btn.textContent = label;
      btn.addEventListener('click', () => {
        if (code === lang) return;
        lang = code;
        document.body.setAttribute('data-lang', code);
        document.documentElement.setAttribute(
          'lang',
          code === 'zh' ? 'zh-Hant' : code === 'ja' ? 'ja' : code === 'ko' ? 'ko' : 'en'
        );
        renderAll();
      });
      wrap.appendChild(btn);
    });
  }

  // ─────── render: hero / info / dining ───────
  function renderHeader() {
    $('brand-name').textContent = store.name[lang];
    $('brand-sub').textContent = store.subtitle[lang];
    $('brand-tagline').textContent = store.tagline[lang];
    $('addr-label').textContent = ui.address[lang];
    $('phone-label').textContent = ui.phone[lang];
    const addrTxt = store.address[lang];
    const addrEl = $('addr-value');
    addrEl.innerHTML = '';
    const a = document.createElement('a');
    a.href = 'https://maps.google.com/?q=' + encodeURIComponent(store.address.zh);
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = addrTxt;
    addrEl.appendChild(a);
  }

  function renderDining() {
    $('dining-title').textContent = ui.dining[lang];
    const ul = $('dining-list');
    ul.innerHTML = '';
    store.dining.forEach((line) => {
      const li = document.createElement('li');
      li.textContent = line[lang];
      ul.appendChild(li);
    });
  }

  // ─────── render: category chips ───────
  function renderCatChips() {
    const bar = $('cat-bar');
    bar.innerHTML = '';
    categories.forEach((c) => {
      const has = menuItems.some((m) => m.category === c.id);
      if (!has) return;
      const btn = document.createElement('button');
      btn.className = 'cat-chip';
      btn.dataset.cat = c.id;
      btn.textContent = c.names[lang];
      btn.addEventListener('click', () => {
        scrollSpyActive = false;
        const sec = document.querySelector(`[data-section="${c.id}"]`);
        if (sec) {
          const top = sec.getBoundingClientRect().top + window.scrollY - 105;
          window.scrollTo({ top, behavior: 'smooth' });
        }
        setActiveChip(c.id);
        clearTimeout(window.__chipTimeout);
        window.__chipTimeout = setTimeout(() => { scrollSpyActive = true; }, 700);
      });
      bar.appendChild(btn);
    });
  }

  function setActiveChip(catId) {
    const chips = document.querySelectorAll('.cat-chip');
    chips.forEach((c) => c.classList.toggle('active', c.dataset.cat === catId));
    const active = document.querySelector(`.cat-chip[data-cat="${catId}"]`);
    if (active) {
      const bar = $('cat-bar');
      const offset = active.offsetLeft - (bar.clientWidth - active.offsetWidth) / 2;
      bar.scrollTo({ left: offset, behavior: 'smooth' });
    }
  }

  // ─────── render: sections + cards ───────
  function renderSections() {
    const wrap = $('sections');
    wrap.innerHTML = '';
    categories.forEach((c) => {
      const items = menuItems.filter((m) => m.category === c.id);
      if (!items.length) return;

      const sec = document.createElement('section');
      sec.className = 'section';
      sec.dataset.section = c.id;
      sec.id = 'sec-' + c.id;

      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `
        <h2 class="section-title">${escapeHtml(c.names[lang])}</h2>
        <span class="section-count">${items.length} items</span>
      `;
      sec.appendChild(header);

      const list = document.createElement('div');
      list.className = 'items';
      items.forEach((it) => list.appendChild(buildCard(it, c.id)));
      sec.appendChild(list);

      wrap.appendChild(sec);
    });
  }

  function buildCard(item, catId) {
    const compact = ['side', 'snack', 'topping'].includes(catId);
    const btn = document.createElement('button');
    btn.className = 'card' + (compact ? ' compact' : '');
    btn.type = 'button';

    const img = document.createElement('div');
    img.className = 'card-img';
    if (item.image) {
      const i = document.createElement('img');
      i.loading = 'lazy';
      i.src = item.image;
      i.alt = item.names[lang];
      img.appendChild(i);
    } else {
      img.textContent = item.emoji || '🍽️';
    }
    btn.appendChild(img);

    const body = document.createElement('div');
    body.className = 'card-body';

    const name = document.createElement('h3');
    name.className = 'card-name';
    name.textContent = item.names[lang];
    body.appendChild(name);

    if (item.tags && item.tags.length) {
      const tags = document.createElement('div');
      tags.className = 'card-tags';
      item.tags.forEach((t) => {
        const def = tagDefs[t];
        if (!def) return;
        const el = document.createElement('span');
        el.className = 'tag tag-' + t;
        el.innerHTML = `<span class="tag-icon">${def.icon}</span><span>${escapeHtml(def.names[lang])}</span>`;
        tags.appendChild(el);
      });
      body.appendChild(tags);
    }

    const prices = document.createElement('div');
    prices.className = 'card-prices';
    const single = item.price.length === 1 && item.price[0].label === null;
    item.price.forEach((p) => {
      const row = document.createElement('div');
      row.className = 'price-row';
      if (p.label) {
        const l = document.createElement('span');
        l.className = 'price-label';
        l.textContent = p.label[lang];
        row.appendChild(l);
      }
      const v = document.createElement('span');
      v.className = 'price-value' + (single ? ' single' : '');
      v.textContent = fmtPrice(p.value);
      if (single && !p.label) row.style.justifyContent = 'flex-end';
      row.appendChild(v);
      prices.appendChild(row);
    });
    body.appendChild(prices);

    if (item.note && item.note[lang]) {
      const note = document.createElement('div');
      note.className = 'card-note';
      note.textContent = item.note[lang];
      body.appendChild(note);
    }

    btn.appendChild(body);
    btn.addEventListener('click', () => openModal(item));
    return btn;
  }

  // ─────── modal ───────
  let lastScroll = 0;
  function openModal(item) {
    lastScroll = window.scrollY;
    const m = $('modal');
    $('modal-name').textContent = item.names[lang];
    const mImg = $('modal-img');
    mImg.innerHTML = '';
    if (item.image) {
      const i = document.createElement('img');
      i.src = item.image;
      i.alt = item.names[lang];
      mImg.appendChild(i);
    } else {
      mImg.textContent = item.emoji || '🍽️';
    }
    const tags = $('modal-tags');
    tags.innerHTML = '';
    (item.tags || []).forEach((t) => {
      const def = tagDefs[t]; if (!def) return;
      const el = document.createElement('span');
      el.className = 'tag tag-' + t;
      el.innerHTML = `<span class="tag-icon">${def.icon}</span><span>${escapeHtml(def.names[lang])}</span>`;
      tags.appendChild(el);
    });
    const pwrap = $('modal-prices');
    pwrap.innerHTML = '';
    const single = item.price.length === 1 && item.price[0].label === null;
    item.price.forEach((p) => {
      const row = document.createElement('div');
      row.className = 'modal-price-row';
      const l = document.createElement('span');
      l.className = 'price-label';
      l.textContent = p.label ? p.label[lang] : (item.category === 'topping' ? '+' : '');
      row.appendChild(l);
      const v = document.createElement('span');
      v.className = 'price-value' + (single ? ' single' : '');
      v.textContent = fmtPrice(p.value);
      row.appendChild(v);
      pwrap.appendChild(row);
    });
    const descTxt = item.desc && item.desc[lang];
    if (descTxt) {
      $('modal-desc-wrap').hidden = false;
      $('modal-desc-label').textContent = ui.description[lang];
      $('modal-desc').textContent = descTxt;
    } else {
      $('modal-desc-wrap').hidden = true;
    }
    const noteTxt = item.note && item.note[lang];
    if (noteTxt) {
      $('modal-note-wrap').hidden = false;
      $('modal-note-label').textContent = ui.note[lang];
      $('modal-note').textContent = noteTxt;
    } else {
      $('modal-note-wrap').hidden = true;
    }
    m.classList.add('open');
    m.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    $('modal-scroll').scrollTop = 0;
  }

  function closeModal() {
    const m = $('modal');
    m.classList.remove('open');
    m.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    window.scrollTo({ top: lastScroll });
  }

  $('modal').addEventListener('click', (e) => {
    if (e.target === $('modal')) closeModal();
  });
  $('modal-close').addEventListener('click', closeModal);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // ─────── scroll spy ───────
  function setupScrollSpy() {
    const onScroll = () => {
      if (!scrollSpyActive) return;
      const secs = document.querySelectorAll('[data-section]');
      let current = null;
      const probe = 130;
      secs.forEach((s) => {
        const r = s.getBoundingClientRect();
        if (r.top - probe <= 0) current = s.dataset.section;
      });
      if (current) setActiveChip(current);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // ─────── util ───────
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  // ─────── boot ───────
  function renderAll() {
    renderLangPills();
    renderHeader();
    renderDining();
    renderCatChips();
    renderSections();
    const cur = document.querySelector('.cat-chip.active')?.dataset.cat;
    if (cur) setActiveChip(cur);
    else if (categories[0]) setActiveChip(categories[0].id);
  }

  renderLangPills();
  renderAll();
  setupScrollSpy();
</script>
</body>
</html>
